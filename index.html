<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Словарик — русско-китайский</title>
  <meta name="description" content="Личный офлайн-словарик русско-китайского: теги, фразы, заметки, озвучка.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d1115">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var theme = 'dark';
      try {
        var raw = localStorage.getItem('slovar.v1');
        var saved = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = (saved === 'light' || saved === 'dark') ? saved : (dark ? 'dark' : 'light');
      } catch (e) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d1115' : '#fbfaf7');
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Словарик">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    </button>

</html>
